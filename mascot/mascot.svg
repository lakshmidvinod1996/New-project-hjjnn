<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="t">
  <title id="t">Project mascot: a cute, happy cell with a pink bow</title>
  <defs>
    <path id="cell" d="M200 45 C288 38 356 98 361 188 C366 278 318 366 212 372 C118 378 42 326 39 232 C36 136 110 51 200 45 Z"/>
    <clipPath id="inside"><use href="#cell"/></clipPath>

    <radialGradient id="cyto" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset=".55" stop-color="#fbf1bf"/>
      <stop offset="1" stop-color="#f3d97f"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbe3ff"/>
      <stop offset="1" stop-color="#d9a6ef"/>
    </radialGradient>
    <radialGradient id="blush" r=".5">
      <stop offset="0" stop-color="#ff8fa3" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ff8fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c4"/>
      <stop offset="1" stop-color="#f27a97"/>
    </linearGradient>
    <linearGradient id="mito" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9a3"/>
      <stop offset="1" stop-color="#f59a6b"/>
    </linearGradient>
    <radialGradient id="ground" r=".5">
      <stop offset="0" stop-color="#b08a3a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#b08a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="200" cy="392" rx="135" ry="14" fill="url(#ground)"/>

  <!-- see-through membrane halo -->
  <use href="#cell" fill="none" stroke="#f6cf5c" stroke-width="22" stroke-linejoin="round" opacity=".35"/>

  <!-- cytoplasm -->
  <use href="#cell" fill="url(#cyto)"/>

  <g clip-path="url(#inside)">
    <!-- inner membrane line -->
    <use href="#cell" fill="none" stroke="#fff6cf" stroke-width="16" opacity=".8"/>

    <!-- nucleus (a soft heart) -->
    <g transform="translate(200 292)">
      <path d="M0 22 C-30 4 -46 -10 -42 -28 C-38 -44 -14 -46 0 -28 C14 -46 38 -44 42 -28 C46 -10 30 4 0 22 Z"
            fill="url(#nucleus)" stroke="#a374c4" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 13 C-22 0 -34 -10 -31 -24 C-28 -35 -12 -36 0 -21 C12 -36 28 -35 31 -24 C34 -10 22 0 0 13 Z"
            fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="3 5" opacity=".7"/>
      <circle cx="8" cy="-12" r="8" fill="#b884d6"/>
      <circle cx="5" cy="-15" r="2.5" fill="#fff" opacity=".8"/>
      <path d="M-26 -30 C-22 -35 -15 -36 -10 -33" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    </g>

    <!-- mitochondria -->
    <g stroke="#d9734a" stroke-width="2.5" stroke-linejoin="round">
      <g transform="translate(103 272) rotate(-35)">
        <rect x="-22" y="-10" width="44" height="20" rx="10" fill="url(#mito)"/>
        <path d="M-14 4 L-9 -4 L-4 4 L1 -4 L6 4 L11 -4" fill="none" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(303 268) rotate(30)">
        <rect x="-19" y="-9" width="38" height="18" rx="9" fill="url(#mito)"/>
        <path d="M-11 3 L-6 -3 L-1 3 L4 -3 L9 3" fill="none" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- wavy reticulum -->
    <g fill="none" stroke="#e7b94a" stroke-width="2.6" stroke-linecap="round" opacity=".8">
      <path d="M248 332 C258 324 268 340 278 332 C288 324 298 338 306 330"/>
      <path d="M252 344 C262 336 272 352 282 344 C290 338 298 348 304 343"/>
    </g>

    <!-- little vesicles -->
    <g fill="#bfe6d4" stroke="#7fbfa3" stroke-width="2">
      <circle cx="140" cy="335" r="9"/>
      <circle cx="160" cy="352" r="5"/>
      <circle cx="78" cy="205" r="6"/>
      <circle cx="330" cy="205" r="7"/>
    </g>
    <g fill="#f0c95a" opacity=".8">
      <circle cx="120" cy="305" r="3"/><circle cx="268" cy="300" r="3"/>
      <circle cx="96" cy="150" r="2.5"/><circle cx="318" cy="150" r="2.5"/>
      <circle cx="245" cy="360" r="2.5"/><circle cx="180" cy="355" r="2.5"/>
    </g>
  </g>

  <!-- outer membrane line -->
  <use href="#cell" fill="none" stroke="#c9952a" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- glossy shine -->
  <path d="M95 140 C108 102 138 76 178 66" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <circle cx="198" cy="63" r="5" fill="#fff" opacity=".9"/>

  <!-- sparkly eyes -->
  <g>
    <ellipse cx="150" cy="168" rx="14" ry="17" fill="#2a1d10"/>
    <ellipse cx="150" cy="175" rx="10" ry="8" fill="#5a3d22"/>
    <circle cx="145" cy="161" r="5" fill="#fff"/>
    <circle cx="155" cy="177" r="2.2" fill="#fff"/>
    <ellipse cx="250" cy="168" rx="14" ry="17" fill="#2a1d10"/>
    <ellipse cx="250" cy="175" rx="10" ry="8" fill="#5a3d22"/>
    <circle cx="245" cy="161" r="5" fill="#fff"/>
    <circle cx="255" cy="177" r="2.2" fill="#fff"/>
    <path d="M134 157 L128 152 M146 151 L141 145 M266 157 L272 152 M254 151 L259 145" stroke="#2a1d10" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- rosy cheeks -->
  <ellipse cx="122" cy="212" rx="22" ry="13" fill="url(#blush)"/>
  <ellipse cx="278" cy="212" rx="22" ry="13" fill="url(#blush)"/>
  <g fill="#d9788a" opacity=".7">
    <circle cx="116" cy="210" r="1.6"/><circle cx="125" cy="206" r="1.4"/><circle cx="128" cy="215" r="1.4"/>
    <circle cx="284" cy="210" r="1.6"/><circle cx="275" cy="206" r="1.4"/><circle cx="272" cy="215" r="1.4"/>
  </g>

  <!-- smile -->
  <path d="M182 207 C188 226 212 226 218 205" fill="#c95b6e" stroke="#4a3315" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M192 218 C197 223 204 223 208 217" fill="none" stroke="#ff9db3" stroke-width="3" stroke-linecap="round"/>

  <!-- pink bow -->
  <g transform="translate(272 70) rotate(18)" stroke="#b84a68" stroke-width="2.5" stroke-linejoin="round">
    <path d="M-2 2 L-9 20 M2 2 L9 20" fill="none" stroke-linecap="round" stroke-width="4"/>
    <path d="M0 0 C-12 -19 -33 -16 -32 -1 C-31 14 -12 16 0 0 Z" fill="url(#bow)"/>
    <path d="M0 0 C12 -19 33 -16 32 -1 C31 14 12 16 0 0 Z" fill="url(#bow)"/>
    <circle r="6.5" fill="#ff9db3"/>
    <path d="M-24 -7 C-20 -11 -15 -11 -13 -8 M24 -7 C20 -11 15 -11 13 -8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- sparkles -->
  <path d="M362 58 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z" fill="#f5c542"/>
  <path d="M30 92 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#ff9db3"/>
  <path d="M374 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#ffb3c4"/>
</svg>
