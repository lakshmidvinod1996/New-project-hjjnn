<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="t">
  <title id="t">Project mascot: a happy little cell with a bow</title>
  <defs>
    <path id="bodyPath" d="M170 40 C235 22 300 45 320 95 C338 140 330 200 332 250 C334 300 318 345 285 375 C250 405 200 412 150 405 C95 397 55 370 45 320 C35 270 55 235 80 210 C100 190 95 150 105 110 C115 70 135 50 170 40 Z"/>
    <clipPath id="body"><use href="#bodyPath"/></clipPath>

    <!-- soft creamy body, lit from the upper right -->
    <radialGradient id="skin" cx="62%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".45" stop-color="#f7efb0"/>
      <stop offset="1" stop-color="#ecd77a"/>
    </radialGradient>
    <!-- warm golden rim on the shadow side -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0a91c"/>
      <stop offset="1" stop-color="#f2c94c"/>
    </linearGradient>
    <radialGradient id="blush" r=".5">
      <stop offset="0" stop-color="#ff8fa3" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ff8fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c4"/>
      <stop offset="1" stop-color="#f27a97"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a2f"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <radialGradient id="ground" r=".5">
      <stop offset="0" stop-color="#b08a3a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b08a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="200" cy="420" rx="130" ry="16" fill="url(#ground)"/>

  <!-- wiggly tail, tapering at the tip -->
  <path d="M195 403 C205 430 160 470 158 500 C156 530 210 520 235 505 C265 490 280 500 295 530 C305 548 330 552 352 534"
        fill="none" stroke="url(#tail)" stroke-width="6" stroke-linecap="round"/>
  <path d="M295 530 C305 548 330 552 352 534" fill="none" stroke="#fdf6dc" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <!-- body -->
  <g clip-path="url(#body)">
    <rect width="400" height="560" fill="url(#skin)"/>
    <path d="M160 38 C132 52 118 78 114 112 C108 160 102 200 80 235 C62 270 66 325 95 355 C125 388 160 402 200 412 L0 430 L0 30 Z" fill="url(#rim)"/>
    <!-- inner glow so the rim blends softly -->
    <path d="M160 38 C132 52 118 78 114 112 C108 160 102 200 80 235 C62 270 66 325 95 355 C125 388 160 402 200 412"
          fill="none" stroke="#fff3c4" stroke-width="10" opacity=".55"/>
  </g>
  <use href="#bodyPath" fill="none" stroke="#6b4f1d" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- glossy shine -->
  <path d="M150 88 C166 70 192 61 214 63" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
  <circle cx="231" cy="64" r="4.5" fill="#fff" opacity=".9"/>
  <path d="M318 180 C322 200 322 220 320 235" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>

  <!-- pink bow -->
  <g transform="translate(257 86) rotate(-8)" stroke="#b84a68" stroke-width="2.5" stroke-linejoin="round">
    <path d="M0 0 C-10 -16 -28 -14 -27 -1 C-26 12 -10 14 0 0 Z" fill="url(#bow)"/>
    <path d="M0 0 C10 -16 28 -14 27 -1 C26 12 10 14 0 0 Z" fill="url(#bow)"/>
    <path d="M-2 2 L-9 18 M2 2 L9 18" fill="none" stroke-linecap="round" stroke-width="3.5"/>
    <circle r="5.5" fill="#ff9db3"/>
    <path d="M-20 -6 C-17 -9 -13 -9 -11 -7 M20 -6 C17 -9 13 -9 11 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- sparkly eyes -->
  <g>
    <ellipse cx="173" cy="157" rx="14" ry="17" fill="#2a1d10"/>
    <ellipse cx="173" cy="164" rx="10" ry="8" fill="#5a3d22"/>
    <circle cx="168" cy="150" r="5" fill="#fff"/>
    <circle cx="178" cy="166" r="2.2" fill="#fff"/>
    <ellipse cx="283" cy="157" rx="14" ry="17" fill="#2a1d10"/>
    <ellipse cx="283" cy="164" rx="10" ry="8" fill="#5a3d22"/>
    <circle cx="278" cy="150" r="5" fill="#fff"/>
    <circle cx="288" cy="166" r="2.2" fill="#fff"/>
    <!-- little lashes -->
    <path d="M157 146 L151 141 M287 140 L292 134 M297 146 L303 141 M169 140 L164 134" stroke="#2a1d10" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- rosy cheeks with freckles -->
  <ellipse cx="152" cy="204" rx="22" ry="13" fill="url(#blush)"/>
  <ellipse cx="304" cy="204" rx="22" ry="13" fill="url(#blush)"/>
  <g fill="#d9788a" opacity=".7">
    <circle cx="146" cy="202" r="1.6"/><circle cx="155" cy="198" r="1.4"/><circle cx="158" cy="207" r="1.4"/>
    <circle cx="310" cy="202" r="1.6"/><circle cx="301" cy="198" r="1.4"/><circle cx="298" cy="207" r="1.4"/>
  </g>

  <!-- sweet smile -->
  <path d="M212 203 C219 222 245 222 252 201" fill="#c95b6e" stroke="#4a3315" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 214 C230 219 238 219 242 213" fill="none" stroke="#ff9db3" stroke-width="3" stroke-linecap="round"/>

  <!-- soft body contours -->
  <g fill="none" stroke="#b39a4e" stroke-width="2.6" stroke-linecap="round" opacity=".75">
    <path d="M310 85 C318 95 320 105 318 115"/>
    <path d="M300 92 C306 100 308 108 306 116"/>
    <path d="M118 258 C106 292 115 330 138 353"/>
    <path d="M316 268 C320 300 311 333 291 352"/>
    <path d="M178 380 C202 393 233 393 257 381"/>
  </g>

  <!-- sparkles -->
  <g fill="#f5c542">
    <path d="M352 70 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
    <path d="M60 150 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#ff9db3"/>
    <path d="M362 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#ffb3c4"/>
  </g>
</svg>
