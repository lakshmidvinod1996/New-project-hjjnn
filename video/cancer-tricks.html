<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>How Cancer Hides</title>
<style>
  @font-face { font-family: Fredoka; src: url(fonts/fredoka-700.woff2) format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; background: #1a0b16; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Fredoka, "Noto Color Emoji", sans-serif; }
  svg { position: absolute; inset: 0; }
  #cap { position: absolute; left: 50%; top: 190px; transform-origin: 50% 50%; width: max-content; max-width: 990px; box-sizing: border-box;
         padding: 26px 46px 30px; border-radius: 48px; color: #fff; font-weight: 700; font-size: 60px; line-height: 1.1;
         background: linear-gradient(135deg, #8b3dff, #3d7bff); box-shadow: 0 14px 0 rgba(40,10,80,.35), 0 0 0 8px rgba(255,255,255,.9);
         text-align: center; }
  #cap b { color: #ffe14d; }
  #sub { position: absolute; left: 70px; right: 70px; top: 1610px; text-align: center; }
  #sub span { display: inline-block; padding: 18px 30px 22px; border-radius: 30px; background: rgba(25,8,30,.72);
              color: #fff; font-weight: 600; font-size: 48px; line-height: 1.22; }
  #sub em { font-style: normal; color: #ffe14d; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5a1030" stop-opacity=".35"/><stop offset="1" stop-color="#5a1030" stop-opacity="0"/></radialGradient>
    <radialGradient id="bokeh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".6" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blushG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff6f96" stop-opacity=".6"/><stop offset="1" stop-color="#ff6f96" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c58bff" stop-opacity=".7"/><stop offset="1" stop-color="#c58bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7ff6ff" stop-opacity=".85"/><stop offset="1" stop-color="#7ff6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff4a5e" stop-opacity=".75"/><stop offset="1" stop-color="#ff4a5e" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowY" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff07a" stop-opacity=".9"/><stop offset="1" stop-color="#fff07a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#2a0018" stop-opacity="0"/><stop offset="1" stop-color="#2a0018" stop-opacity=".55"/></radialGradient>
    <radialGradient id="bloodBg" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#ff9ab4"/><stop offset=".5" stop-color="#f2557e"/><stop offset="1" stop-color="#9c0f3c"/></radialGradient>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6f0"/><stop offset=".55" stop-color="#ffc4d8"/><stop offset="1" stop-color="#ff9fbf"/></linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9cbc"/><stop offset="1" stop-color="#d9608c"/></linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0e0"/><stop offset="1" stop-color="#ffb3cc"/></linearGradient>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a0a30"/><stop offset="1" stop-color="#c72a5a"/></linearGradient>
    <linearGradient id="wallG2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7a0a30"/><stop offset="1" stop-color="#c72a5a"/></linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3048"/><stop offset=".5" stop-color="#16111f"/><stop offset="1" stop-color="#07050b"/></linearGradient>
    <linearGradient id="hairF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2338"/><stop offset="1" stop-color="#0b0810"/></linearGradient>
    <radialGradient id="skinG" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#ffe2cc"/><stop offset=".6" stop-color="#f6bf98"/><stop offset="1" stop-color="#d9946d"/></radialGradient>
    <linearGradient id="coatG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef3fb"/><stop offset="1" stop-color="#c9d5e8"/></linearGradient>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2730"/><stop offset="1" stop-color="#0c0a10"/></linearGradient>
    <radialGradient id="irisG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#b07040"/><stop offset=".6" stop-color="#6b3a1c"/><stop offset="1" stop-color="#3a1d0b"/></radialGradient>
    <linearGradient id="penG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5aa0ff"/><stop offset="1" stop-color="#1d4fc4"/></linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e5594"/><stop offset="1" stop-color="#1b2850"/></linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#f5c331"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
    <linearGradient id="stopG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a68"/><stop offset="1" stop-color="#c9142c"/></linearGradient>
    <linearGradient id="liquidG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8fbff"/><stop offset=".5" stop-color="#3fe3ff"/><stop offset="1" stop-color="#0094d6"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#d6f3ff" stop-opacity=".55"/></linearGradient>
    <linearGradient id="badgeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a44dff"/><stop offset="1" stop-color="#2f6fff"/></linearGradient>
    <radialGradient id="brainG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffd6e6"/><stop offset=".6" stop-color="#ff8fb8"/><stop offset="1" stop-color="#e0558c"/></radialGradient>
    <radialGradient id="domeG" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#b56bff" stop-opacity=".12"/><stop offset=".8" stop-color="#9b4dff" stop-opacity=".3"/><stop offset="1" stop-color="#e2b8ff" stop-opacity=".6"/></radialGradient>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L45 0 L60 26 L45 52 L15 52 L0 26 Z" fill="none" stroke="#f0d6ff" stroke-width="3"/>
    </pattern>
    <path id="badgeArc" d="M-118,0 A118,118 0 0 1 118,0"/>
    <path id="badgeArc2" d="M-112,0 A112,112 0 0 0 112,0"/>
  </defs>
  <g id="world"></g>
</svg>
<div id="cap"></div>
<div id="sub"></div>
</div>

<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const f = n => Math.round(n * 10) / 10;
const rnd = i => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const D = Math.PI / 180;

const PAL = {
  tcell: ['#e6f8ff', '#5fc4f5', '#1f6fb3'],
  body: ['#fff2f7', '#ffabc5', '#de6f97'],
  cancer: ['#efd9ff', '#a466ec', '#55209c'],
  rbc: ['#ffc2c8', '#f23a52', '#9c0c28'],
};
// glossy gradients
(() => {
  const defs = document.querySelector('defs');
  let s = '';
  for (const k in PAL) {
    const [l, m, d] = PAL[k];
    s += `<radialGradient id="g-${k}" cx=".5" cy=".5" r=".62" fx=".34" fy=".28"><stop offset="0" stop-color="${l}"/><stop offset=".55" stop-color="${m}"/><stop offset="1" stop-color="${d}"/></radialGradient>`;
  }
  defs.insertAdjacentHTML('beforeend', s);
})();

function smoothClosed(pts) {
  const n = pts.length; let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + 'Z';
}
function blob(cx, cy, r, n, amp, t, seed = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = 1 + amp * ((i % 2) ? 1 : -0.35) * (0.85 + 0.15 * Math.sin(t * 3 + i + seed)) + 0.02 * Math.sin(t * 2 + i * 1.7 + seed);
    pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]);
  }
  return smoothClosed(pts);
}
function star(cx, cy, r, n = 4, inner = 0.38, rot = 0) {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = rot * D + (i / (n * 2)) * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * inner : r;
    d += (i ? 'L' : 'M') + f(cx + Math.cos(a) * rr) + ',' + f(cy + Math.sin(a) * rr);
  }
  return d + 'Z';
}
const gloss = (cx, cy, rx, ry = rx) =>
  `<ellipse cx="${f(cx - rx * .3)}" cy="${f(cy - ry * .5)}" rx="${f(rx * .38)}" ry="${f(ry * .2)}" fill="url(#hl)" transform="rotate(-26 ${f(cx - rx * .3)} ${f(cy - ry * .5)})"/>` +
  `<circle cx="${f(cx + rx * .12)}" cy="${f(cy - ry * .66)}" r="${f(rx * .055)}" fill="#fff" opacity=".75"/>` +
  `<path d="M${f(cx + rx * .35)},${f(cy + ry * .78)} Q${f(cx + rx * .9)},${f(cy + ry * .45)} ${f(cx + rx * .9)},${f(cy - ry * .1)}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="${f(rx * .07)}" stroke-linecap="round"/>`;
const ball = (cx, cy, rx, ry, k) => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="url(#g-${k})"/>` + gloss(cx, cy, rx, ry);
const shadow = (cx, cy, rx, ry, op = 1) => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="url(#sh)" opacity="${op}"/>`;
const armEnd = (x, y, sg, a, len) => [x + sg * Math.sin(a * D) * len, y + Math.cos(a * D) * len];

// ---------- faces ----------
function face(x, y, s, o = {}) {
  const { eyes = 'open', mouth = 'smile', lx = 0, ly = 0, brows = null, gap = 20, blush = true } = o;
  let g = '';
  const ink = '#1d1430';
  for (const sg of [-1, 1]) {
    const cx = x + sg * gap * s;
    const st = (eyes === 'wink' && sg === 1) ? 'happy' : eyes;
    if (st === 'open' || st === 'wide') {
      const ry = st === 'wide' ? 14 : 12;
      g += `<ellipse cx="${f(cx + lx * s)}" cy="${f(y + ly * s)}" rx="${f(9.5 * s)}" ry="${f(ry * s)}" fill="${ink}"/>
            <circle cx="${f(cx + lx * s - 3 * s)}" cy="${f(y + ly * s - 4.5 * s)}" r="${f(3.8 * s)}" fill="#fff"/>
            <circle cx="${f(cx + lx * s + 3.2 * s)}" cy="${f(y + ly * s + 4.5 * s)}" r="${f(1.8 * s)}" fill="#fff"/>`;
    } else if (st === 'half') {
      g += `<path d="M${f(cx - 9.5 * s)},${f(y)} A${f(9.5 * s)},${f(9 * s)} 0 0 0 ${f(cx + 9.5 * s)},${f(y)} Z" fill="${ink}"/>
            <path d="M${f(cx - 11 * s)},${f(y)} L${f(cx + 11 * s)},${f(y)}" stroke="${ink}" stroke-width="${f(3 * s)}" stroke-linecap="round"/>`;
    } else if (st === 'closed') {
      g += `<path d="M${f(cx - 9 * s)},${f(y)} Q${f(cx)},${f(y + 8 * s)} ${f(cx + 9 * s)},${f(y)}" stroke="${ink}" stroke-width="${f(3.4 * s)}" fill="none" stroke-linecap="round"/>`;
    } else if (st === 'happy') {
      g += `<path d="M${f(cx - 9 * s)},${f(y + 3 * s)} Q${f(cx)},${f(y - 9 * s)} ${f(cx + 9 * s)},${f(y + 3 * s)}" stroke="${ink}" stroke-width="${f(3.6 * s)}" fill="none" stroke-linecap="round"/>`;
    }
    if (brows === 'angry') g += `<path d="M${f(cx - sg * 11 * s)},${f(y - 20 * s)} L${f(cx + sg * 8 * s)},${f(y - 14 * s)}" stroke="${ink}" stroke-width="${f(3.6 * s)}" stroke-linecap="round"/>`;
    if (brows === 'up') g += `<path d="M${f(cx - 9 * s)},${f(y - 19 * s)} Q${f(cx)},${f(y - 27 * s)} ${f(cx + 9 * s)},${f(y - 19 * s)}" stroke="${ink}" stroke-width="${f(3 * s)}" fill="none" stroke-linecap="round"/>`;
    if (brows === 'worried') g += `<path d="M${f(cx - sg * 10 * s)},${f(y - 16 * s)} L${f(cx + sg * 8 * s)},${f(y - 22 * s)}" stroke="${ink}" stroke-width="${f(3.2 * s)}" stroke-linecap="round"/>`;
    if (brows === 'sly') g += `<path d="M${f(cx - 9 * s)},${f(y - (sg < 0 ? 22 : 17) * s)} Q${f(cx)},${f(y - (sg < 0 ? 26 : 19) * s)} ${f(cx + 9 * s)},${f(y - (sg < 0 ? 20 : 19) * s)}" stroke="${ink}" stroke-width="${f(3.2 * s)}" fill="none" stroke-linecap="round"/>`;
    if (blush) g += `<ellipse cx="${f(x + sg * (gap + 12) * s)}" cy="${f(y + 13 * s)}" rx="${f(10 * s)}" ry="${f(6 * s)}" fill="url(#blushG)"/>`;
  }
  const my = y + 19 * s;
  if (mouth === 'smile') g += `<path d="M${f(x - 9 * s)},${f(my - 2 * s)} Q${f(x)},${f(my + 9 * s)} ${f(x + 9 * s)},${f(my - 2 * s)}" stroke="${ink}" stroke-width="${f(3.2 * s)}" fill="none" stroke-linecap="round"/>`;
  else if (mouth === 'open' || mouth === 'grin') {
    const w = mouth === 'grin' ? 13 : 10;
    g += `<path d="M${f(x - w * s)},${f(my - 3 * s)} Q${f(x)},${f(my - 1 * s)} ${f(x + w * s)},${f(my - 3 * s)} Q${f(x + w * .8 * s)},${f(my + 12 * s)} ${f(x)},${f(my + 12 * s)} Q${f(x - w * .8 * s)},${f(my + 12 * s)} ${f(x - w * s)},${f(my - 3 * s)}Z" fill="#7a1d3a"/>
          <ellipse cx="${f(x)}" cy="${f(my + 8 * s)}" rx="${f(w * .5 * s)}" ry="${f(3.4 * s)}" fill="#ff7c9c"/>`;
  } else if (mouth === 'o') g += `<ellipse cx="${f(x)}" cy="${f(my + 2 * s)}" rx="${f(4.5 * s)}" ry="${f(5.5 * s)}" fill="#7a1d3a"/>`;
  else if (mouth === 'whistle') g += `<ellipse cx="${f(x + 6 * s)}" cy="${f(my + 1 * s)}" rx="${f(3.6 * s)}" ry="${f(4 * s)}" fill="#7a1d3a"/>`;
  else if (mouth === 'yawn') g += `<ellipse cx="${f(x)}" cy="${f(my + 4 * s)}" rx="${f(9 * s)}" ry="${f(12 * s)}" fill="#7a1d3a"/><ellipse cx="${f(x)}" cy="${f(my + 11 * s)}" rx="${f(5.5 * s)}" ry="${f(3.6 * s)}" fill="#ff7c9c"/>`;
  else if (mouth === 'sly') g += `<path d="M${f(x - 11 * s)},${f(my - 3 * s)} Q${f(x - 2 * s)},${f(my + 7 * s)} ${f(x + 11 * s)},${f(my - 6 * s)}" stroke="${ink}" stroke-width="${f(3.4 * s)}" fill="none" stroke-linecap="round"/>`;
  else if (mouth === 'flat') g += `<path d="M${f(x - 7 * s)},${f(my + 2 * s)} L${f(x + 7 * s)},${f(my + 2 * s)}" stroke="${ink}" stroke-width="${f(3.2 * s)}" stroke-linecap="round"/>`;
  else if (mouth === 'scared') g += `<path d="M${f(x - 10 * s)},${f(my + 4 * s)} q${f(2.5 * s)},${f(-4 * s)} ${f(5 * s)},0 t${f(5 * s)},0 t${f(5 * s)},0 t${f(5 * s)},0" stroke="${ink}" stroke-width="${f(3 * s)}" fill="none" stroke-linecap="round"/>`;
  return g;
}

function policeCap(x, y, s, rot = -8) {
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(s * 100) / 100})">
    <path d="M-40,2 C-44,-30 -22,-46 0,-46 C22,-46 44,-30 40,2 Z" fill="url(#capG)"/>
    <ellipse cx="-14" cy="-30" rx="14" ry="6" fill="#fff" opacity=".25" transform="rotate(-20 -14 -30)"/>
    <rect x="-42" y="-8" width="84" height="13" rx="5" fill="#141d3a"/>
    <path d="M-38,4 Q0,26 38,4 Q0,13 -38,4Z" fill="#0b1020"/>
    <path d="${star(0, -22, 11, 5, .45)}" fill="url(#goldG)" stroke="#a87808" stroke-width="1.5"/>
  </g>`;
}

// ---------- T cell ----------
function tcell(x, y, s, o = {}) {
  const sq = o.sq || 1, r = 60 * s, rx = r * (2 - sq), ry = r * sq;
  const cy = y - ry - 12 * s;
  let g = shadow(x, y, r * .95, 11 * s, o.shOp ?? 1);
  g += `<g transform="rotate(${f(o.tilt || 0)} ${f(x)} ${f(y)})">`;
  // feet
  for (const sg of [-1, 1]) {
    const ph = o.walk || 0, lift = o.walk ? Math.max(0, Math.sin(ph + (sg > 0 ? Math.PI : 0))) * 10 * s : 0;
    const dx = o.walk ? Math.cos(ph + (sg > 0 ? Math.PI : 0)) * 8 * s : 0;
    g += `<ellipse cx="${f(x + sg * 24 * s + dx)}" cy="${f(y - 7 * s - lift)}" rx="${f(18 * s)}" ry="${f(9.5 * s)}" fill="#1d5f9c"/>`;
  }
  // receptors
  for (let i = 0; i < 6; i++) {
    const a = (-160 + i * 28) * D, c = Math.cos(a), sn = Math.sin(a);
    const bx = x + c * rx * .92, by = cy + sn * ry * .92, tx = x + c * rx * 1.16, ty = cy + sn * ry * 1.16;
    const px = -sn, py = c;
    g += `<path d="M${f(bx)},${f(by)} L${f(tx)},${f(ty)} M${f(tx)},${f(ty)} l${f((c * 9 + px * 8) * s)},${f((sn * 9 + py * 8) * s)} M${f(tx)},${f(ty)} l${f((c * 9 - px * 8) * s)},${f((sn * 9 - py * 8) * s)}" stroke="#76d36a" stroke-width="${f(4.5 * s)}" stroke-linecap="round" fill="none"/>`;
  }
  g += ball(x, cy, rx, ry, 'tcell');
  // arms
  const arms = [[-1, o.armL ?? 15], [1, o.armR ?? 15]];
  for (const [sg, a] of arms) {
    const sx = x + sg * rx * .86, sy = cy + ry * .15;
    const [hx, hy] = armEnd(sx, sy, sg, a, 34 * s);
    g += `<path d="M${f(sx)},${f(sy)} L${f(hx)},${f(hy)}" stroke="#2f86cf" stroke-width="${f(12 * s)}" stroke-linecap="round"/>
          <circle cx="${f(hx)}" cy="${f(hy)}" r="${f(9.5 * s)}" fill="#7fd2f8"/>`;
  }
  g += face(x, cy + 6 * s, s * 1.25, Object.assign({ gap: 17 }, o.face || {}));
  if (o.cap !== false) g += policeCap(x - 4 * s, cy - ry * .62, s * 1.05, o.capRot ?? -8);
  if (o.sw !== undefined) {
    const k = o.sw, px = x + rx * .42, py = cy + ry * .5, w = 44 * s, h = 22 * s;
    const col = k > .5 ? '#3ccf6a' : '#ff4a5e';
    g += `<rect x="${f(px - w / 2)}" y="${f(py - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(h / 2)}" fill="${col}" stroke="#fff" stroke-width="${f(3 * s)}"/>
          <circle cx="${f(px + lerp(-w / 2 + h / 2, w / 2 - h / 2, k))}" cy="${f(py)}" r="${f(h * .38)}" fill="#fff"/>
          <text x="${f(px)}" y="${f(py - h * .85)}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="${f(17 * s)}" fill="${col}" stroke="#fff" stroke-width="${f(4 * s)}" paint-order="stroke">${k > .5 ? 'ON' : 'OFF'}</text>`;
  }
  g += '</g>';
  if (o.zzz !== undefined) {
    for (let i = 0; i < 3; i++) {
      const p = ((o.zzz * .6 + i / 3) % 1);
      g += `<text x="${f(x + rx * .7 + p * 50 * s + i * 6)}" y="${f(cy - ry * .9 - p * 110 * s)}" font-family="Fredoka" font-weight="700" font-size="${f((26 + p * 22) * s)}" fill="#3d7bff" stroke="#fff" stroke-width="${f(5 * s)}" paint-order="stroke" opacity="${f(Math.sin(p * Math.PI))}">z</text>`;
    }
  }

  [4, 6.4, 'Trick one: cancer cells are <em>YOUR</em> cells.'],
  [6.4, 9, 'To your immune patrol, they look like family.'],
  [9, 12, 'Trick two: they hide their ID tags,'],
  [12, 15, 'so nothing looks wrong.'],
  [15, 17, 'Trick three: when a T cell gets close,'],
  [17, 19.2, 'they flash a fake “stop” signal, <em>PD-L1</em>,'],
  [19.2, 21, 'and switch it off.'],
  [21, 23.4, 'Then they build a shield'],
  [23.4, 26, 'that keeps defenders out.'],
  [26, 28.4, 'Immunotherapy blocks that stop signal and wakes your defenders up.'],
  [28.4, 30, 'Follow <em>The Brainy Muse!</em>'],
];

// ---------- scenes ----------
function scene1(t) {
  let g = bgBlood(t);
  const turn = sm(prog(t, 2.1, 2.6));
  const pose = mixPose(POSES.surf, POSES.curious, turn);
  const bob = Math.sin(t * 3.2) * 14 * (1 - turn * .6);
  const bx = 540, by = 1440 + bob;
  g += `<ellipse cx="${bx}" cy="${by + 70}" rx="220" ry="26" fill="#6a0020" opacity=".25"/>`;
  g += rbc(bx, by + 26, 2.2, Math.sin(t * 3.2 + .6) * 4 * (1 - turn));
  // wake splashes
  for (let i = 0; i < 6; i++) {
    const p = (t * 1.8 + i / 6) % 1;
    g += `<circle cx="${f(bx - 200 - p * 260)}" cy="${f(by + 30 - Math.sin(p * Math.PI) * 60)}" r="${f(16 * (1 - p) + 4)}" fill="#fff" opacity="${f(.6 * (1 - p))}"/>`;
  }
  const squash = 1 - Math.sin(turn * Math.PI) * .12;
  g += muse(bx, by - 150 * 1.32 - 10, 1.32, {
    pose, lean: lerp(9, -4, turn) + Math.sin(t * 3.2) * 2 * (1 - turn), sx: squash,
    wave: Math.sin(t * 7) * 10 * (1 - turn) + 14 * (1 - turn), lx: lerp(7, 0, turn),
    brow: turn > .5, mouth: (t > 2.5 && t < 3.3) ? 'o' : 'smile',
  });
  // curious question marks
  for (let i = 0; i < 2; i++) {
    const k = back(prog(t, 2.8 + i * .3, 3.2 + i * .3));
    if (k > 0) {
      const x = 760 + i * 90, y = 700 - i * 80 + Math.sin(t * 4 + i) * 10;
      g += `<text x="${x}" y="${f(y)}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="${f(110 * k)}" fill="#fff" stroke="#8b3dff" stroke-width="10" paint-order="stroke" transform="rotate(${12 - i * 20} ${x} ${f(y)})">?</text>`;
    }
  }
  return g;
}

function scene2(t) {
  let g = bgStreet(t, true);
  const houses = [[150, 1310, 0], [410, 1300, 1], [930, 1305, 2]];
  for (const [x, y, i] of houses) g += bodyCell(x, y, 1, t, i);
  // the disguised cancer cell, sitting in the row
  const lt = t - 4;
  const waving = lt > 2.2 && lt < 3.8;
  g += cancer(670, 1300, 1.3, {
    disg: 1, seed: 2, armL: 20, armR: waving ? 150 + Math.sin(lt * 14) * 22 : 22,
    face: { mouth: 'grin', brows: null, eyes: 'open', lx: lerp(-3, 3, prog(lt, 2, 4)) },
  }, t);
  // patrolling T cells
  const x1 = lerp(-120, 1220, prog(lt, 0, 5)), x2 = lerp(-420, 900, prog(lt, 0, 5));
  const near = 1 - Math.min(1, Math.abs(x1 - 650) / 220);
  g += tcell(x2, 1520, .95, { walk: t * 11 + 1, face: { mouth: 'smile', lx: 2 } });
  g += tcell(x1, 1560, 1.2, {
    walk: t * 11, armR: near > .2 ? 160 + Math.sin(t * 16) * 22 : 15, armL: 15,
    face: { mouth: near > .2 ? 'open' : 'smile', eyes: near > .5 ? 'happy' : 'open', lx: 3 },
  });
  if (near > .3) {
    g += `<g transform="translate(${f(x1 + 30)} 1300)" opacity="${f(clamp((near - .3) * 3))}">
      <path d="M-70,-40 h140 a24,24 0 0 1 24,24 v24 a24,24 0 0 1 -24,24 h-90 l-24,22 l4,-22 h-30 a24,24 0 0 1 -24,-24 v-24 a24,24 0 0 1 24,-24z" fill="#fff" stroke="#5fc4f5" stroke-width="5"/>
      <text x="12" y="10" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="34" fill="#1f6fb3">Hi, fam!</text></g>`;
  }
  return g;
}

function scene3(t) {
  let g = bgStreet(t, true);
  const lt = t - 9, cx = 680, gy = 1420, s = 1.55;
  const r = 78 * s, cy = gy - r - 8 * s;
  // tag anchor positions on the cell surface
  const anchors = [-150, -118, -90, -62, -30].map(a => [cx + Math.cos(a * D) * r * .98, cy + Math.sin(a * D) * r * .98, a + 90]);
  const pluck = sm(prog(lt, 1.0, 2.2)), hide = sm(prog(lt, 2.2, 3.2));
  const [hx, hy] = cHand(cx, gy, s, 1, lerp(lerp(20, 165, pluck), 40, hide));
  const behindPos = [cx + r * .92, cy + r * .1];
  let tagsFront = '', tagsBehind = '';
  anchors.forEach(([ax, ay, rot], i) => {
    const pk = sm(prog(lt, 1.0 + i * .18, 1.7 + i * .18));
    let x = lerp(ax, hx - 10 + i * 5, pk), y = lerp(ay, hy - 10, pk), rr = lerp(rot, -10 + i * 6, pk);
    x = lerp(x, behindPos[0] - 30 + i * 6, hide); y = lerp(y, behindPos[1] - 20 - i * 4, hide);
    const tg = idTag(x, y, s * (1 - hide * .2), rr, 1 - hide * .6);
    if (hide > .55) tagsBehind += tg; else tagsFront += tg;
  });
  const mood = lt < 1 ? { mouth: 'smile', brows: null } : lt < 3.2 ? { mouth: 'sly', brows: 'sly', lx: 3 } : { mouth: 'whistle', brows: 'up', eyes: lt > 5 ? 'open' : 'happy', lx: -3 };
  g += cancer(cx, gy, s, { seed: 3, armL: lt > 3.2 ? 22 : 20, armR: lerp(lerp(20, 165, pluck), 40, hide), behind: tagsBehind, front: tagsFront, face: mood }, t);
  if (lt > 3.3) for (let i = 0; i < 2; i++) {
    const p = ((lt - 3.3) * .7 + i * .5) % 1;
    g += `<text x="${f(cx + 120 + p * 60)}" y="${f(cy - 60 - p * 120)}" font-family="Noto Color Emoji" font-size="${f(46 + i * 6)}" opacity="${f(Math.sin(p * Math.PI))}">🎵</text>`;
  }
  // inspector T cell
  const enter = sm(prog(lt, 2.4, 3.6));
  const tx = lerp(-150, 330, enter), tgy = 1530;
  const insp = lt > 3.6 && lt < 5.1, shrug = sm(prog(lt, 5.1, 5.4));
  const lens = [cx - 70 + Math.sin(lt * 3.2) * 70, cy - 10 + Math.cos(lt * 2.4) * 40];
  const ts = 1.25;
  const handR = tHand(tx, tgy, ts, 1, 70);
  g += tcell(tx, tgy, ts, {
    walk: enter < 1 ? t * 11 : 0, armR: shrug > 0 ? lerp(70, 150, shrug) : 70, armL: shrug > 0 ? lerp(15, 150, shrug) : 15,
    face: shrug > 0 ? { mouth: 'flat', brows: 'up', lx: 0 } : { mouth: 'o', brows: 'up', lx: 4, eyes: 'wide' },
  });
  if (shrug <= 0) {
    const L = insp ? lens : [handR[0] + 50, handR[1] - 40];
    g += `<path d="M${f(handR[0])},${f(handR[1])} L${f(L[0] - 30)},${f(L[1] + 30)}" stroke="#9a5a2a" stroke-width="12" stroke-linecap="round"/>
          <circle cx="${f(L[0])}" cy="${f(L[1])}" r="52" fill="#d9f6ff" fill-opacity=".35" stroke="#7a4a1f" stroke-width="10"/>
          <path d="M${f(L[0] - 28)},${f(L[1] - 18)} Q${f(L[0] - 18)},${f(L[1] - 34)} ${f(L[0])},${f(L[1] - 36)}" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>`;
  } else {
    g += `<text x="${f(tx)}" y="${f(tgy - 230)}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="${f(64 * back(shrug))}" fill="#fff" stroke="#1f6fb3" stroke-width="9" paint-order="stroke">?!</text>`;
  }
  return g;
}

function scene4(t) {
  let g = bgStreet(t, true);
  const lt = t - 15, cx = 760, gy = 1440, s = 1.4;
  const flash = back(prog(lt, 1.9, 2.3));
  const arm = lerp(25, 150, sm(prog(lt, 1.8, 2.1)));
  const [hx, hy] = cHand(cx, gy, s, -1, arm);
  const sign = flash > 0 ? stopSign(hx - 10, hy - 150 * flash, 1.25 * flash, Math.sin(lt * 10) * 3, .6 + .4 * Math.sin(lt * 12), t) : '';
  g += cancer(cx, gy, s, { seed: 5, armL: arm, armR: 25, face: flash > 0 ? { mouth: 'grin', brows: 'sly', lx: -4 } : { mouth: 'sly', brows: 'sly', lx: -4 } }, t);
  g += sign;
  // marching T cell
  const march = sm(prog(lt, 0, 1.8));
  const tx = lerp(-160, 470, march);
  const sw = 1 - sm(prog(lt, 2.6, 2.85));
  const yawn = lt > 3.0 && lt < 4.1;
  const sleep = sm(prog(lt, 4.1, 4.8));
  const ts = 1.3;
  g += tcell(tx, 1560, ts, {
    walk: march < 1 ? t * 13 : 0, sw,
    armL: yawn ? 160 : lerp(15, 5, sleep), armR: yawn ? 160 : lerp(march < 1 ? 60 + Math.sin(t * 13) * 25 : 15, 5, sleep),
    tilt: lerp(0, -14, sleep), sq: 1 - sleep * .12, capRot: lerp(-8, -30, sleep),
    face: sw > .5 ? { brows: 'angry', mouth: 'flat', lx: 4 } : yawn ? { mouth: 'yawn', eyes: 'closed' } : lt > 4.1 ? { eyes: 'closed', mouth: 'o' } : { eyes: 'half', mouth: 'flat' },
    zzz: lt > 4.4 ? (lt - 4.4) * 1.6 : undefined,
  });
  if (lt > 2.6 && lt < 3.2) {
    const k = prog(lt, 2.6, 3.2);
    const px = tx + 60 * ts * .42, py = 1560 - 60 * ts * .5 - 12 * ts;
    for (let i = 0; i < 6; i++) {
      const a = i * 60 * D;
      g += `<path d="M${f(px + Math.cos(a) * 30 * k)},${f(py + Math.sin(a) * 30 * k)} L${f(px + Math.cos(a) * (30 + 40 * k))},${f(py + Math.sin(a) * (30 + 40 * k))}" stroke="#ffe14d" stroke-width="7" stroke-linecap="round" opacity="${f(1 - k)}"/>`;
    }
  }
  return g;
}

function scene5(t) {
  let g = bgStreet(t, true);
  const lt = t - 21, gx = 560, gy = 1440;
  g += cancer(430, 1430, 1.0, { seed: 7, face: { mouth: 'sly', brows: 'sly', lx: -3 } }, t);
  g += cancer(690, 1430, 1.05, { seed: 8, face: { mouth: 'grin', brows: 'sly', lx: 3 } }, t + 1);
  g += cancer(560, 1300, .85, { seed: 9, armL: 150 + Math.sin(t * 10) * 15, armR: 150 + Math.sin(t * 10 + 1) * 15, face: { mouth: 'open', eyes: 'happy' } }, t + 2);
  // dome
  const k = back(prog(lt, .3, 1.5));
  if (k > 0) {
    const R = 340 * k, H = 330 * k;
    const d = `M${gx - R},${gy} A${R},${H} 0 0 1 ${gx + R},${gy} Z`;
    let ripple = '';
    for (const [ht, side] of [[2.15, -1], [3.1, 1], [3.9, -1]]) {
      const p = prog(lt, ht, ht + .6);
      if (p > 0 && p < 1) ripple += `<circle cx="${gx + side * 300}" cy="${gy - 140}" r="${f(30 + p * 140)}" fill="none" stroke="#fff" stroke-width="${f(10 * (1 - p))}" opacity="${f(1 - p)}"/>`;
    }
    g += `<ellipse cx="${gx}" cy="${gy - H * .45}" rx="${f(R * 1.25)}" ry="${f(H * 1.1)}" fill="url(#glowP)" opacity=".7"/>
      <path d="${d}" fill="url(#domeG)"/>
      <path d="${d}" fill="url(#hex)" opacity="${f(.35 + .15 * Math.sin(t * 5))}"/>
      <path d="M${gx - R},${gy} A${R},${H} 0 0 1 ${gx + R},${gy}" fill="none" stroke="#f3dcff" stroke-width="7" opacity=".9"/>
      <path d="M${gx - R * .72},${gy - H * .55} A${R * .8},${H * .8} 0 0 1 ${gx - R * .15},${gy - H * .97}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".55"/>
      ${ripple}`;
  }
  // defenders bouncing off
  const runner = (start, side, s, y) => {
    const p = lt - start;
    if (p < 0) return '';
    const edge = gx + side * (340 + 62 * s);
    let x, sq = 1, tilt = 0;
    if (p < .55) x = lerp(side * 900 + gx, edge, sm(p / .55));
    else { const q = prog(p, .55, 1.6); x = edge + side * eo(q) * 300; sq = 1 - Math.sin(prog(p, .55, .8) * Math.PI) * .25; tilt = side * 25 * Math.sin(q * Math.PI); }
    const hit = p > .5 && p < 1.0;
    let gg = tcell(x, y - (p > .55 ? Math.sin(prog(p, .55, 1.3) * Math.PI) * 120 : 0), s, {
      walk: p < .55 ? t * 15 : 0, sq, tilt, face: hit ? { eyes: 'closed', mouth: 'o' } : p < .55 ? { brows: 'angry', mouth: 'open', lx: -side * 4 } : { eyes: 'wide', mouth: 'o', brows: 'worried' },
    });
    if (hit) gg += `<path d="${star(edge - side * 70, y - 140, 60 * Math.sin(prog(p, .5, 1) * Math.PI), 8, .45)}" fill="#ffe14d" stroke="#fff" stroke-width="5"/>
      <text x="${edge - side * 110}" y="${y - 230}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="52" fill="#fff" stroke="#8b3dff" stroke-width="9" paint-order="stroke" transform="rotate(${-side * 10} ${edge - side * 110} ${y - 230})">BOING!</text>`;
    return gg;
  };
  g += runner(1.6, -1, 1.0, 1540) + runner(2.55, 1, 1.0, 1550) + runner(3.35, -1, .9, 1500);
  return g;
}

function scene6(t) {
  let g = bgStreet(t, true);
  const lt = t - 26, gy = 1440;
  const impact = 1.0;
  // the cancer cell and its sign
  const hit = prog(lt, impact, impact + 1.2);
  const scared = lt > 2.0;
  const [hx, hy] = cHand(820, gy, 1.25, -1, hit > 0 ? lerp(150, 40, sm(prog(lt, impact, impact + .3))) : 150);
  g += cancer(820, gy, 1.25, { seed: 5, armL: hit > 0 ? lerp(150, 40, sm(prog(lt, impact, impact + .3))) : 150, armR: 25, sweat: scared,
    face: scared ? { eyes: 'wide', mouth: 'scared', brows: 'worried' } : hit > 0 ? { eyes: 'wide', mouth: 'o', brows: 'up' } : { mouth: 'grin', brows: 'sly', lx: -4 } }, t);
  if (hit <= 0) g += stopSign(hx - 10, hy - 150, 1.1, Math.sin(lt * 10) * 3, .5, t);
  else if (hit < 1) g += stopSign(hx - 10 + eo(hit) * 600, hy - 150 - eo(hit) * 900 + hit * hit * 300, 1.1 * (1 - hit * .4), hit * 720, 0, t);
  // impact burst
  const bp = prog(lt, impact, impact + .45);
  if (bp > 0 && bp < 1) {
    g += `<circle cx="${f(hx)}" cy="${f(hy - 150)}" r="${f(40 + bp * 220)}" fill="url(#glowC)" opacity="${f(1 - bp)}"/>
          <path d="${star(hx, hy - 150, 120 * Math.sin(bp * Math.PI), 10, .45, bp * 40)}" fill="#fff" opacity="${f(1 - bp * .6)}"/>`;
  }
  // T cells wake and charge
  const wake = lt > impact + .5;
  const cheer = lt > impact + .6 && lt < 2.4;
  const charge = sm(prog(lt, 2.3, 3.4));
  const team = [[170, 1560, 1.2, 0], [380, 1600, 1.05, .7]];
  for (const [x0, y0, s, ph] of team) {
    const sl = wake ? 0 : 1;
    const jump = cheer ? Math.abs(Math.sin((lt - impact) * 7 + ph)) * 50 : 0;
    const x = lerp(x0, x0 + 400, charge);
    g += tcell(x, y0 - jump, s, {
      sw: wake ? sm(prog(lt, impact + .5, impact + .7)) : 0, tilt: sl * -14, sq: 1 - sl * .12, capRot: sl ? -30 : -8,
      armL: cheer ? 160 + Math.sin(lt * 14 + ph) * 15 : sl ? 5 : 70, armR: cheer ? 160 + Math.sin(lt * 14 + ph + 1) * 15 : sl ? 5 : 70,
      walk: charge > 0 && charge < 1 ? t * 16 + ph : 0, shOp: 1,
      face: sl ? { eyes: 'closed', mouth: 'o' } : cheer ? { eyes: 'happy', mouth: 'grin' } : { brows: 'angry', mouth: 'open', lx: 4 },
      zzz: sl ? lt * 1.6 + ph : undefined,
    });
  }
  // Muse zooms in with the syringe
  const fly = eo(prog(lt, 0, impact));
  const mx = lerp(-260, 300, fly), my = lerp(560, 1060, fly) + Math.sin(lt * 4) * 10 * (lt > impact ? 1 : 0);
  const ms = lerp(.55, .82, fly);
  const settle = sm(prog(lt, 2.4, 2.9));
  const pose = mixPose(POSES.hero, POSES.wave, settle);
  // syringe in Muse's local space, pointing at the sign
  const syr = settle < 1 ? `<g opacity="${f(1 - settle)}">${syringe(140, -176, 1.15, 37, .7 + .3 * Math.sin(lt * 10), t)}</g>` : '';
  if (fly < 1) for (let i = 0; i < 6; i++) {
    g += `<path d="M${f(mx - 120 - i * 40)},${f(my - 300 + i * 30)} l${f(-160)},${f(-110)}" stroke="#fff" stroke-width="${8 - i}" stroke-linecap="round" opacity="${f(.6 * (1 - fly))}"/>`;
  }
  // sparkle trail
  for (let i = 0; i < 8; i++) {
    const p = (lt * 1.5 + i / 8) % 1;
    g += `<path d="${star(mx - 160 - p * 160, my - 120 + Math.sin(i * 2) * 80, 14 * Math.sin(p * Math.PI), 4, .35)}" fill="${i % 2 ? '#7ff6ff' : '#ffe14d'}"/>`;
  }
  g += muse(mx, my, ms, { pose, lean: lerp(lerp(18, 4, fly), 0, settle), prop: syr, wink: lt > 2.6 && lt < 3.6, mouth: 'smile', wave: 10 * (1 - fly) });
  // badge
  FG = badge(540, 560, back(prog(lt, 2.75, 3.15)), t);
  return g;
}

const SCENE_FNS = [scene1, scene2, scene3, scene4, scene5, scene6];

let FG = '';
// per-scene camera: [zoom, focus x, focus y, screen y]
const CAM = [[1, 540, 960, 960], [1.32, 540, 1450, 1420], [1.3, 560, 1430, 1420], [1.3, 570, 1450, 1420], [1.25, 560, 1420, 1410], [1.12, 520, 1400, 1400]];
function render(t) {
  const si = SCENES.findIndex(s => t >= s.a && t < s.b);
  const i = si < 0 ? SCENES.length - 1 : si, sc = SCENES[i];
  const lt = t - sc.a, len = sc.b - sc.a;
  const [cz, fx, fy, sy] = CAM[i];
  const zoom = cz * (1 + .035 * (lt / len));
  FG = '';
  let g = `<g transform="translate(540 ${sy}) scale(${f(zoom * 1000) / 1000}) translate(${-fx} ${-fy})">${SCENE_FNS[i](t)}</g>` + FG;
  g += `<rect width="1080" height="1920" fill="url(#vig)"/>`;
  // dip between scenes
  let dip = 0;
  for (const s of SCENES.slice(1)) dip = Math.max(dip, 1 - Math.abs(t - s.a) / .16);
  if (dip > 0) g += `<rect width="1080" height="1920" fill="#fff0f6" opacity="${f(dip * .95)}"/>`;
  document.getElementById('world').innerHTML = g;

  const cap = document.getElementById('cap');
  const ck = back(prog(lt, .12, .5));
  cap.innerHTML = sc.cap;
  cap.style.transform = `translateX(-50%) scale(${ck.toFixed(3)}) rotate(-2deg)`;
  cap.style.opacity = ck > 0 ? 1 : 0;
  const sub = SUBS.find(s => t >= s[0] && t < s[1]) || SUBS[SUBS.length - 1];
  const sk = clamp((t - sub[0]) / .15);
  document.getElementById('sub').innerHTML = `<span style="opacity:${sk.toFixed(2)};transform:translateY(${((1 - sk) * 16).toFixed(1)}px)">${sub[2]}</span>`;
}
window.render = render;

// preview: plays in a loop when opened in a browser
if (!location.hash.includes('capture')) {
  const st = performance.now();
  const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); document.getElementById('stage').style.transform = `scale(${k})`; document.getElementById('stage').style.transformOrigin = '0 0'; };
  addEventListener('resize', fit); fit();
  const loop = () => { render(((performance.now() - st) / 1000) % 30); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
